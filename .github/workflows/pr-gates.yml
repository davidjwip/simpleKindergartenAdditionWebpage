name: PR gates

# Every pull request into UAT or main gets the same gate the laptop runs, and main additionally
# refuses anything that did not come through UAT.
on:
  pull_request:
    branches: [UAT, main]

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Coverage thresholds (per file)
        run: npm run test:coverage:threshold

      - name: Build
        run: npm run build

  flow:
    # Only main has a source rule, so only PRs targeting main pay for this job.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: main only accepts UAT, from this repository
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          echo "flow: $HEAD (from $HEAD_REPO) -> main"
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::main takes releases from this repository's UAT branch, not a fork."
            exit 1
          fi
          if [ "$HEAD" != "UAT" ]; then
            echo "::error::main only takes merges from UAT; this PR is $HEAD -> main. Merge into UAT first, then release from UAT."
            exit 1
          fi
          echo "flow OK"
